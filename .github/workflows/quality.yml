name: Quality

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Check, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_0123456789abcdef
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/openschool
      NEXT_PUBLIC_APP_URL: http://app.openschool.local:3000
      NEXT_PUBLIC_WWW_URL: http://www.openschool.local:3000

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun run audit:security

      - name: Validate environment contract
        run: bun run env:check

      - name: Check formatting and static analysis
        run: bun run check

      - name: Lint application
        run: bun run lint

      - name: Type-check workspaces
        run: bun run typecheck

      - name: Run tests
        run: bun test

      - name: Build application
        run: bun run build

  database-smoke:
    name: Migrate and seed a clean database twice
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: openschool
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d openschool"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/openschool

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate migration metadata
        run: bun run db:check

      - name: Apply baseline migrations
        run: bun run db:migrate

      - name: Seed representative tenants
        run: bun run db:seed

      - name: Prove migration and seed idempotence
        run: |
          bun run db:migrate
          bun run db:seed
