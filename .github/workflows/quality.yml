name: Quality

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Check, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_0123456789abcdef
      DATABASE_MIGRATION_URL: postgresql://migration:ci@127.0.0.1:5432/openschool
      DATABASE_MIGRATION_ROLE: migration
      DATABASE_RUNTIME_URL: postgresql://openschool_runtime:ci@127.0.0.1:5432/openschool
      DATABASE_RUNTIME_ROLE: openschool_runtime
      DATABASE_WORKER_URL: postgresql://openschool_worker:ci@127.0.0.1:5432/openschool
      DATABASE_WORKER_ROLE: openschool_worker
      DATABASE_CONTROL_PLANE_URL: postgresql://openschool_control_plane:ci@127.0.0.1:5432/openschool
      DATABASE_CONTROL_PLANE_ROLE: openschool_control_plane
      OPENSCHOOL_STUDENT_SLICE_MODE: forced_rls
      INVITATION_TOKEN_ENCRYPTION_KEY_ID: ci-v1
      INVITATION_TOKEN_ENCRYPTION_KEYS: '{"ci-v1":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"}'
      SUPABASE_SECRET_KEY: sb_secret_ci_0123456789abcdef
      OPENSCHOOL_ALLOW_OPEN_SIGNUP: "false"
      NEXT_PUBLIC_APP_URL: http://app.openschool.local:3000
      NEXT_PUBLIC_WWW_URL: http://www.openschool.local:3000

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun run audit:security

      - name: Validate environment contract
        run: bun run env:check

      - name: Check formatting and static analysis
        run: bun run check

      - name: Enforce database access boundaries
        run: bun run db:boundary-check

      - name: Lint application
        run: bun run lint

      - name: Type-check workspaces
        run: bun run typecheck

      - name: Run tests
        run: bun test

      - name: Build application
        run: bun run build

  database-smoke:
    name: Migrate and seed a clean database twice
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: openschool
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d openschool"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ALLOW_SECURITY_POC: "true"
      ALLOW_STUDENT_RLS_POC: "true"
      ALLOW_TENANT_FOUNDATION_POC: "true"
      ALLOW_IDENTITY_FOUNDATION_POC: "true"
      ALLOW_DATABASE_EXECUTION_POC: "true"
      ALLOW_TENANT_CONTEXT_POC: "true"
      ALLOW_POLICY_QUERY_POC: "true"
      ALLOW_AUDIT_POC: "true"
      ALLOW_INVITATION_ONBOARDING_POC: "true"
      ALLOW_IDENTITY_REVOCATION_POC: "true"
      ALLOW_ROLE_PROVISIONING: "true"
      DATABASE_MIGRATION_URL: postgresql://postgres:postgres@127.0.0.1:5432/openschool
      DATABASE_MIGRATION_ROLE: postgres
      DATABASE_RUNTIME_URL: postgresql://openschool_runtime:runtime-ci-only-1@127.0.0.1:5432/openschool
      DATABASE_RUNTIME_ROLE: openschool_runtime
      DATABASE_WORKER_URL: postgresql://openschool_worker:worker-ci-only-1@127.0.0.1:5432/openschool
      DATABASE_WORKER_ROLE: openschool_worker
      DATABASE_CONTROL_PLANE_URL: postgresql://openschool_control_plane:control-plane-ci-only-1@127.0.0.1:5432/openschool
      DATABASE_CONTROL_PLANE_ROLE: openschool_control_plane
      OPENSCHOOL_STUDENT_SLICE_MODE: forced_rls
      INVITATION_TOKEN_ENCRYPTION_KEY_ID: ci-v1
      INVITATION_TOKEN_ENCRYPTION_KEYS: '{"ci-v1":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"}'
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_0123456789abcdef
      NEXT_PUBLIC_APP_URL: http://app.openschool.local:3000
      NEXT_PUBLIC_WWW_URL: http://www.openschool.local:3000

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate migration metadata
        run: bun run db:check

      - name: Provision named role identities before RLS migrations
        env:
          ROLE_PROVISIONING_PHASE: identities
        run: bun run db:provision-roles

      - name: Apply baseline migrations
        run: bun run db:migrate

      - name: Seed representative tenants
        run: bun run db:seed

      - name: Prove migration and seed idempotence
        run: |
          bun run db:migrate
          bun run db:seed

      - name: Provision non-owner runtime and worker roles
        env:
          ROLE_PROVISIONING_PHASE: grants
        run: bun run db:provision-roles

      - name: Prove transaction-scoped database execution
        run: bun run db:execution-poc

      - name: Prove transaction-scoped RLS with real roles
        run: bun run db:security-poc

      - name: Prove Tenant and Organization Tree constraints
        run: bun run db:tenant-foundation-poc

      - name: Prove Account and Person identity boundaries
        run: bun run db:identity-foundation-poc

      - name: Prove verified Tenant Request Context denials
        run: bun run auth:tenant-context-poc

      - name: Prove capability Policy Decision query constraints
        run: bun run policy:query-poc

      - name: Prove forced-RLS Student and School boundaries
        run: bun run db:student-rls-poc

      - name: Prove atomic and tamper-evident Audit Ledger boundaries
        run: bun run audit:poc

      - name: Prove invitation-only onboarding boundaries
        run: bun run invitation:onboarding-poc

      - name: Prove immediate identity revocation boundaries
        run: bun run identity:revocation-poc

  database-upgrade:
    name: Upgrade representative existing data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: openschool
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d openschool"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ALLOW_TENANT_FOUNDATION_POC: "true"
      DATABASE_MIGRATION_URL: postgresql://postgres:postgres@127.0.0.1:5432/openschool
      DATABASE_MIGRATION_ROLE: postgres
      DATABASE_RUNTIME_URL: postgresql://openschool_runtime:runtime-ci-only-1@127.0.0.1:5432/openschool
      DATABASE_RUNTIME_ROLE: openschool_runtime
      DATABASE_WORKER_URL: postgresql://openschool_worker:worker-ci-only-1@127.0.0.1:5432/openschool
      DATABASE_WORKER_ROLE: openschool_worker
      DATABASE_CONTROL_PLANE_URL: postgresql://openschool_control_plane:control-plane-ci-only-1@127.0.0.1:5432/openschool
      DATABASE_CONTROL_PLANE_ROLE: openschool_control_plane
      OPENSCHOOL_STUDENT_SLICE_MODE: forced_rls

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare representative migration 0002 data
        run: bun run db:prepare-upgrade-fixture

      - name: Provision named role identities before RLS migrations
        env:
          ALLOW_ROLE_PROVISIONING: "true"
          ROLE_PROVISIONING_PHASE: identities
        run: bun run db:provision-roles

      - name: Apply Tenant foundation migrations twice
        run: |
          bun run db:migrate
          bun run db:migrate

      - name: Verify upgraded rows and constraints
        run: bun run db:verify-upgrade-fixture
