name: Quality

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Check, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/openschool
      NEXT_PUBLIC_APP_URL: http://app.openschool.local:3000
      NEXT_PUBLIC_WWW_URL: http://www.openschool.local:3000

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting and static analysis
        run: bun run check

      - name: Lint application
        run: bun run lint

      - name: Type-check workspaces
        run: bun run typecheck

      - name: Run tests
        run: bun test

      - name: Build application
        run: bun run build
